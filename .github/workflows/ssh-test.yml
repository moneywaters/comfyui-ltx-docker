name: Build SSH Test Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.ssh-test"
      - "clore/ssh-test-init.sh"
      - ".github/workflows/ssh-test.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          docker build -f Dockerfile.ssh-test \
            -t moneywaters/comfyui-ltx:ssh-test \
            -t moneywaters/comfyui-ltx:ssh-only \
            .
          docker push moneywaters/comfyui-ltx:ssh-test
          docker push moneywaters/comfyui-ltx:ssh-only
