name: Build SimplePod Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.simplepod"
      - "start.sh"
      - "download-models.sh"
      - "Containerfile"
      - "Dockerfile"
      - ".github/workflows/simplepod.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and push SimplePod image
        run: |
          set -euo pipefail
          # Pull the already-built base (latest) then build only the overlay.
          # Overlay rebuilds quickly; base is rebuilt by build.yml on Containerfile changes.
          docker pull moneywaters/comfyui-ltx:latest
          docker build -t moneywaters/comfyui-ltx:simplepod -f Dockerfile.simplepod .
          docker push moneywaters/comfyui-ltx:simplepod
