name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra Docker tag (also always pushes :latest)"
        required: false
        default: "clore"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || 'clore' }}"
          docker build \
            -t moneywaters/comfyui-ltx:latest \
            -t "moneywaters/comfyui-ltx:${TAG}" \
            -t "moneywaters/comfyui-ltx:sha-${GITHUB_SHA::12}" \
            -f Containerfile .

      - name: Push image
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || 'clore' }}"
          docker push moneywaters/comfyui-ltx:latest
          docker push "moneywaters/comfyui-ltx:${TAG}"
          docker push "moneywaters/comfyui-ltx:sha-${GITHUB_SHA::12}"
