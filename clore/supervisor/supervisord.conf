; Optional/legacy. Primary PID1 is /etc/supervisor/init.sh which starts
; sshd immediately, then ComfyUI in the background (SSH never waits on models).
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=5

[program:comfyui]
command=/bin/bash -c 'export DISABLE_SSHD=1; exec /opt/start.sh'
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=50
stdout_logfile=/var/log/supervisor/comfyui.log
stderr_logfile=/var/log/supervisor/comfyui.err
