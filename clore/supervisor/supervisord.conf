[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.err

[program:comfyui]
command=/bin/bash /opt/start.sh
environment=DISABLE_SSHD="1"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/comfyui.log
stderr_logfile=/var/log/supervisor/comfyui.err
startsecs=5
startretries=20

[program:delegated_entrypoint]
command=/bin/bash /etc/delegated-entrypoint.sh
autostart=true
autorestart=false
priority=30
stdout_logfile=/var/log/supervisor/delegated.log
stderr_logfile=/var/log/supervisor/delegated.err
