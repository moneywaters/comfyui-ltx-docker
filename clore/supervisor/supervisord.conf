# Clore conf.d program file (loaded by official /etc/supervisor/supervisord.conf).
# Must keep [program:sshd] so mon_container / reverse SSH work on Clore hosts.
# Replaces stock jupyter with ComfyUI; keeps delegated_entrypoint for Clore onstart.
[supervisord]
nodaemon=true

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=10

[program:comfyui]
command=/bin/bash -c 'export DISABLE_SSHD=1; exec /opt/start.sh'
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=50
stdout_logfile=/var/log/supervisor/comfyui.log
stderr_logfile=/var/log/supervisor/comfyui.err
environment=DISABLE_SSHD="1",BACKGROUND_MODELS="1"

[program:delegated_entrypoint]
command=/bin/bash /etc/delegated-entrypoint.sh
autostart=true
autorestart=false
priority=30
