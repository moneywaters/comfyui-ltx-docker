# Replaces jupyter program from cloreai/jupyter with ComfyUI.
# Keeps official SSH + delegated_entrypoint programs so mon_container/SSH work.
[supervisord]
nodaemon=true

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
priority=10

[program:comfyui]
command=/bin/bash -c 'export DISABLE_SSHD=1; exec /opt/start.sh'
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=30
stdout_logfile=/var/log/supervisor/comfyui.log
stderr_logfile=/var/log/supervisor/comfyui.err

[program:delegated_entrypoint]
command=/bin/bash /etc/delegated-entrypoint.sh
autostart=true
autorestart=false
priority=30
