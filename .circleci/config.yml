version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: medium
    steps:
      - checkout
      - run:
          name: Build and Push
          no_output_timeout: 5h
          command: |
            set -euo pipefail
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            
            # Start build in background with output to file
            docker build -t "$IMAGE" -f Containerfile . > /tmp/build.log 2>&1 &
            BUILD_PID=$!
            
            # Echo progress every 30s to keep step alive
            while kill -0 $BUILD_PID 2>/dev/null; do
              echo "=== $(date) === $(wc -c < /tmp/build.log) bytes of build output"
              sleep 30
            done
            
            wait $BUILD_PID || BUILD_EXIT=$?
            BUILD_EXIT=${BUILD_EXIT:-0}
            
            echo "=== BUILD EXIT: $BUILD_EXIT ==="
            cat /tmp/build.log
            
            [ $BUILD_EXIT -ne 0 ] && exit $BUILD_EXIT
            
            echo "=== PUSH ==="
            docker push "$IMAGE"
            echo "=== DONE: $IMAGE ==="

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
