version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build and Push
          no_output_timeout: 5h
          environment:
            BUILDKIT_PROGRESS: plain
          command: |
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            docker build --progress plain -t "$IMAGE" -f Containerfile .  
            docker push "$IMAGE"

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
