version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: medium
    steps:
      - checkout
      - run:
          name: Build Image and Push
          no_output_timeout: 5h
          command: |
            export DOCKER_BUILDKIT=0
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            docker build -t "$IMAGE" -f Containerfile . > /tmp/log 2>&1 &
            PID=$!
            while kill -0 $PID 2>/dev/null; do echo "alive $(date +%s)"; sleep 30; done
            wait $PID; EC=$?; cat /tmp/log; exit $EC
      - run:
          name: Push
          command: docker push "docker.io/${DOCKER_USER}/comfyui-ltx:latest"

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
