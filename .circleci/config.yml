version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: large
    steps:
      - checkout
      - run:
          name: Docker Build and Push
          no_output_timeout: 3h
          command: |
            set -euo pipefail
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            
            echo "=== $(date) Login ==="
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            
            echo "=== $(date) Pull base ==="
            docker pull pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
            
            echo "=== $(date) Build ==="
            docker build -t "$IMAGE" -f Containerfile . 2>&1
            EXIT_CODE=$?
            echo "BUILD EXIT CODE: $EXIT_CODE"
            [ $EXIT_CODE -ne 0 ] && exit $EXIT_CODE
            
            echo "=== $(date) Push ==="
            docker push "$IMAGE"
            echo "=== DONE $(date) ==="

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
