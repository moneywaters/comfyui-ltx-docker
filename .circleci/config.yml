version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: medium
    steps:
      - checkout
      - run:
          name: Build and Push (long-running)
          no_output_timeout: 5h
          background: true
          command: |
            set -euo pipefail
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            docker build -t "$IMAGE" -f Containerfile . > /tmp/build-log.txt 2>&1
            echo "BUILD_OK" > /tmp/build-done.txt
            docker push "$IMAGE" >> /tmp/build-log.txt 2>&1
            echo "PUSH_OK" > /tmp/push-done.txt
      - run:
          name: Wait for build to complete
          no_output_timeout: 5h
          command: |
            while [ ! -f /tmp/build-done.txt ]; do
              sleep 60
              echo "$(date): $(wc -l < /tmp/build-log.txt 2>/dev/null) build lines"
            done
            echo "=== BUILD COMPLETE ==="
            tail -20 /tmp/build-log.txt
            if [ -f /tmp/push-done.txt ]; then
              echo "=== PUSH COMPLETE ==="
            else
              echo "ERROR: Push did not complete"
              exit 1
            fi

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
