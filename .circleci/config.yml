version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: medium
    steps:
      - checkout
      - run:
          name: Build and Push
          no_output_timeout: 5h
          command: |
            set -euo pipefail
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            echo "=== Build $(date) ==="
            docker build -t "$IMAGE" -f Containerfile . 2>&1 | cat
            BUILD_OK=${PIPESTATUS[0]}
            echo "Exit code: $BUILD_OK"
            if [ $BUILD_OK -ne 0 ]; then exit $BUILD_OK; fi
            echo "=== Push $(date) ==="
            docker push "$IMAGE"
            echo "=== COMPLETE: $IMAGE ==="

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
