version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: large
    steps:
      - checkout
      - run:
          name: Build and Push
          no_output_timeout: 3h
          command: chmod +x buildah-build.sh && bash buildah-build.sh

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
