version: 2.1
jobs:
  build-and-push:
    machine:
      image: ubuntu-2204:current
      resource_class: medium
    steps:
      - checkout
      - run:
          name: Build and Push
          no_output_timeout: 5h
          command: |
            IMAGE="docker.io/${DOCKER_USER}/comfyui-ltx:latest"
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin docker.io
            docker build --progress=plain -t "$IMAGE" -f Containerfile . 2>&1 | tee /tmp/build.log
            BUILD_EXIT=${PIPESTATUS[0]}
            if [ $BUILD_EXIT -ne 0 ]; then
              echo "BUILD FAILED with exit $BUILD_EXIT"
              exit $BUILD_EXIT
            fi
            docker push "$IMAGE"

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
